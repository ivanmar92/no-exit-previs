<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NO EXIT · Previs Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f7f8;font:14px system-ui,-apple-system,sans-serif}header{padding:12px 16px;background:#1d2a33;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}h1{margin:0;font-size:17px}small{color:#aebac3}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer;color:#f5f7f8;background:#263743;border:1px solid #51616a;border-radius:8px;padding:9px 11px}button.active,.accent{background:#d6f2ad;color:#18251b;font-weight:700}.main{display:grid;grid-template-columns:180px minmax(0,1fr)215px;height:calc(100dvh - 166px);min-height:340px}aside{background:#17232c;overflow:auto;padding:12px}#view{position:relative;min-height:300px;background:#e5e8e9}canvas{width:100%;height:100%;display:block;touch-action:none}.overlay{position:absolute;left:9px;top:9px;display:flex;gap:6px}.info{position:absolute;bottom:10px;left:10px;color:#27353a;background:#ffffffc9;padding:7px;border-radius:6px;font-size:12px}#shots button{display:block;width:100%;text-align:left;margin-bottom:6px}label{display:block;margin:8px 0;color:#c5d1d9;font-size:12px}input[type=range]{width:100%;accent-color:#d6f2ad}footer{background:#17232c;padding:12px}#track{display:flex;gap:3px;margin:9px 0 4px}#track button{padding:5px 2px;min-width:0}#clock{font-variant-numeric:tabular-nums}#status{font-size:11px;color:#bbdca7}@media(max-width:780px){header{padding:10px}.main{height:auto;display:flex;flex-direction:column}#view{height:47dvh;min-height:280px;order:0}aside:first-child{order:1;padding:6px;overflow-x:auto}aside:first-child h3{display:none}#shots{display:flex;gap:5px}#shots button{min-width:128px}aside:last-child{order:2;max-height:170px}footer{padding:9px}h3{margin:4px 0}} 
</style></head><body>
<header><div><h1>NO EXIT · PREVIS STUDIO</h1><small>Escena 01 · Sagrada Família · Maqueta 3D esquemática</small></div><div class="buttons"><button id="save">Guardar</button><button id="export">Exportar JSON</button><button id="reset">Restablecer</button></div></header>
<div class="main"><aside><h3>Microplanos</h3><div id="shots"></div></aside><main id="view"><canvas id="canvas"></canvas><div class="overlay"><button id="shotview" class="active">Cámara</button><button id="mapview">Mapa</button></div><div id="info" class="info">Sagrada Família · subida del metro</div></main><aside><h3>Ajustar cámara</h3><div id="controls"></div><div id="status">Cambios guardados en este navegador</div></aside></div>
<footer><div class="buttons"><button class="accent" id="play">▶ Reproducir</button><button id="start">↶ Inicio</button><span id="clock">0.0 / 12 s</span><button id="png">Exportar PNG</button></div><div id="track"></div><input id="seek" type="range" min="0" max="12" step="0.02" value="0"></footer>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),can=$('canvas'),ctx=can.getContext('2d');if(!ctx){$('status').textContent='Canvas no disponible';return}
const initial=()=>({shots:[['01 · Gancho',0,1,-1,2,-10,0,-1.2,-12,52],['02 · Pie subiendo',1,2,0,-2.1,-14,0,-2,-11,48],['03 · Barandilla',2,3,2,-1,-10,0,-1.5,-10,50],['04 · Sale del metro',3,5,-3,2,-3,0,-1,-8,38],['05 · Mira atrás',5,7,0,1,-4,0,-2,-11,46],['06 · Huye por la calle',7,9,-4,2,1,0,1,1,42],['07 · Descubre taxi',9,12,-3,2,4,3,1,8,42]].map(a=>({name:a[0],a:a[1],b:a[2],pos:a.slice(3,6),target:a.slice(6,9),lens:a[9]})),route:[[-14,-3.6],[-13,-3.2],[-12,-2.8],[-11,-2.4],[-10,-2],[-9,-1.6],[-8,-1.2],[-7,-.8],[-6,-.4],[-5,0],[1,0],[8,0]]});
let data=initial();try{const v=JSON.parse(localStorage.getItem('noexit-previs-v3'));if(v?.shots?.length===7)data=v}catch{}
let time=0,sel=0,mode='cam',playing=false,last=0,width=1,height=1;
const interp=(a,b,t)=>a+(b-a)*t,ground=z=>z<=-14?-3.6:z>=-5?0:(z+5)*.4;
function actor(){let z=time<5?interp(-14,-5,time/5):interp(-5,8,(time-5)/7);return {x:0,z,y:ground(z)}}
function shotIndex(){let i=data.shots.findIndex(s=>time>=s.a&&time<s.b);return i<0?6:i}
function project(p){if(mode==='map')return [width/2+p[0]*18,height*.6-p[2]*12-p[1]*5];let s=data.shots[sel],a=s.pos,b=s.target,d=b.map((v,i)=>v-a[i]),L=Math.hypot(...d)||1,f=d.map(v=>v/L),r=[-f[2],0,f[0]],R=Math.hypot(...r)||1;r=r.map(v=>v/R);let u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]],q=p.map((v,i)=>v-a[i]),dep=q.reduce((n,v,i)=>n+v*f[i],0);if(dep<=.1)return null;let scale=height*.8*(45/s.lens)/dep;return [width/2+q.reduce((n,v,i)=>n+v*r[i],0)*scale,height/2-q.reduce((n,v,i)=>n+v*u[i],0)*scale,dep]}
function poly(pts,color){let pp=pts.map(project);if(pp.some(p=>!p))return;ctx.beginPath();ctx.moveTo(pp[0][0],pp[0][1]);pp.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#a4acb0';ctx.lineWidth=.6;ctx.stroke()}
function box(x,y,z,w,h,d,c){poly([[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y+h,z-d/2],[x-w/2,y+h,z-d/2]],c);poly([[x-w/2,y+h,z-d/2],[x+w/2,y+h,z-d/2],[x+w/2,y+h,z+d/2],[x-w/2,y+h,z+d/2]],'#fff');poly([[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x+w/2,y+h,z+d/2],[x+w/2,y+h,z-d/2]],'#c9d1d5')}
function line(a,b,col='#83929a',sw=2){let x=project(a),y=project(b);if(!x||!y)return;ctx.beginPath();ctx.moveTo(...x);ctx.lineTo(...y);ctx.strokeStyle=col;ctx.lineWidth=sw;ctx.stroke()}
function text(s,p){const x=project(p);if(!x)return;ctx.fillStyle='#34444e';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(s,x[0],x[1])}
function draw(){let w=can.clientWidth,h=can.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(w!==width||h!==height){width=w;height=h;can.width=Math.round(w*dpr);can.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#e1e5e6';ctx.fillRect(0,0,width,height);if(mode==='cam'){ctx.fillStyle='#343b44';ctx.fillRect(0,0,width,height*.24)}
box(0,-.15,7,14,.14,28,'#e8e9e9');for(let i=0;i<18;i++){let z=-13.75+i*.5;box(0,ground(z)-.16,z,4.5,.15,.50,'#edf0f1')}
for(let x of [-2.4,2.4]){box(x,-3.6,-9.5,.15,3.6,9,'#d3d8d9');line([x,-2.6,-14],[x,1,-5])}
box(0,2.4,-5.2,6.5,.65,.2,'#fafafa');for(let i=0;i<7;i++){box(-2.8+i*.85,0,-19-i*.4,.5,3+i*.6,.6,'#cdd3d8')}
for(let j=0;j<5;j++){box(j%2?8:-8,0,j*5-2,2.5,4,3,'#d0d5d8')}
box(2.8,.2,8,2.4,.9,4.2,'#c2cbd0');box(2.8,1.1,8,1.9,.6,2.7,'#f9fafa');box(2.8,1.75,8,.8,.2,.6,'#fff');
let p=actor(),swing=Math.sin(time*16)*.15;box(p.x,p.y+.5,p.z,.52,.9,.4,'#fcfcfc');box(p.x,p.y+1.43,p.z,.40,.42,.4,'#fff');box(-.16,p.y+.10+swing,p.z+.12,.18,.58,.22,'#e7e7e7');box(.16,p.y+.1-swing,p.z-.12,.18,.58,.22,'#e7e7e7');
text('Sagrada Família',[0,2.85,-5]);text('TAXI',[2.8,2.15,8]);$('info').textContent=data.shots[sel].name+' · '+time.toFixed(1)+' s'+(mode==='map'?' · mapa':'')}
function redraw(){let index=shotIndex();if(sel!==index){sel=index;controls()}document.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('active',+x.dataset.s===sel));$('clock').textContent=time.toFixed(1)+' / 12 s';$('seek').value=time;draw()}
function save(){try{localStorage.setItem('noexit-previs-v3',JSON.stringify(data));$('status').textContent='Guardado correctamente'}catch(e){$('status').textContent='No se pudo guardar: exporta JSON'}}
function controls(){const div=$('controls');div.replaceChildren();const s=data.shots[sel];[['Objetivo (mm)','lens',null],['Cámara X','pos',0],['Cámara Y','pos',1],['Cámara Z','pos',2],['Mirada X','target',0],['Mirada Y','target',1],['Mirada Z','target',2]].forEach(([name,k,i])=>{let v=i===null?s[k]:s[k][i],label=document.createElement('label'),r=document.createElement('input');label.textContent=name+' · '+v;r.type='range';r.min=k==='lens'?20:-20;r.max=k==='lens'?105:20;r.step=k==='lens'?1:.1;r.value=v;r.oninput=()=>{if(i===null)s[k]=+r.value;else s[k][i]=+r.value;label.textContent=name+' · '+r.value;save();draw()};div.append(label,r)})}
for(let i=0;i<7;i++){const s=data.shots[i],b=document.createElement('button');b.dataset.s=i;b.textContent=s.name;b.onclick=()=>{playing=false;time=s.a;sel=i;controls();redraw()};$('shots').append(b);let t=document.createElement('button');t.dataset.s=i;t.textContent=i+1;t.style.flex=s.b-s.a;t.onclick=b.onclick;$('track').append(t)}
$('play').onclick=()=>{playing=!playing;last=performance.now();$('play').textContent=playing?'❚❚ Pausar':'▶ Reproducir'};$('start').onclick=()=>{playing=false;time=0;redraw()};$('seek').oninput=()=>{playing=false;time=+$('seek').value;redraw()};$('shotview').onclick=()=>{mode='cam';$('shotview').className='active';$('mapview').className='';draw()};$('mapview').onclick=()=>{mode='map';$('mapview').className='active';$('shotview').className='';draw()};$('save').onclick=save;$('reset').onclick=()=>{if(confirm('¿Restablecer los ajustes?')){data=initial();sel=0;time=0;controls();save();redraw()}};$('export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='no-exit-previs.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('png').onclick=()=>{let a=document.createElement('a');a.download='no-exit-plano-'+(sel+1)+'.png';a.href=can.toDataURL();a.click()};
window.addEventListener('error',e=>{$('status').textContent='Error: '+e.message});function frame(now){if(playing){time+=Math.min(.1,Math.max(0,(now-last)/1000));if(time>=12){time=11.99;playing=false;$('play').textContent='▶ Reproducir'}redraw()}last=now;requestAnimationFrame(frame)}controls();redraw();requestAnimationFrame(frame);
})();
</script></body></html>
